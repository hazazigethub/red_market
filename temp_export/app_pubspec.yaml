name: red_market
description: A modern Flutter project for LOCAL app with Reels functionality.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: 11.0.0
  red_market_core:
    path: ../core
  

  # 🧠 State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: 17.5.0

  # 🎨 UI & Design
  google_fonts: 8.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  carousel_slider: ^5.0.0

  # 📱 Reels & Media Features
  video_player: ^2.9.2
  chewie: ^1.8.5
  image_picker: ^1.1.2
  # ✅ تم إضافة وتحديث مكاتب الكاش لضمان أفضل أداء للصور
  cached_network_image: ^3.4.1 
  flutter_cache_manager: ^3.4.1
  video_compress: ^3.1.2

  # 🌐 Data & Backend
  supabase_flutter: ^2.8.1
  shared_preferences: ^2.3.2 # النسخة الأحدث اللي ذكرتها
  intl: ^0.20.2
  path_provider: ^2.1.3
  share_plus: 13.3.0
  url_launcher: ^6.3.0


  # 🔔 Notifications & Timezone
  flutter_local_notifications: 22.3.0
  overlay_support: ^2.1.0
  timezone: 0.11.1
  timeago: ^3.7.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # 🖼️ توليد أيقونة التطبيق من صورة واحدة
  flutter_launcher_icons: ^0.14.4

# ===== إعدادات أيقونة التطبيق =====
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/applogo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/applogo.png"

flutter:
  uses-material-design: true

  # 📂 أصول التطبيق
  assets:
    - assets/images/logo.png
    - assets/images/applogo.png
    - assets/icons/
    - assets/avatars/
    - assets/images/sar_symbol.png
    - assets/images/film_icon.png
    - assets/images/whale.png
    - assets/images/sports_equipment.png
    - assets/images/treadmill.png
    - assets/images/ladiesfashion.png
    - assets/images/menfashion.png